<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="vue.global.prod.js"></script>
</head>
<body>
<div id="app" v-cloak>
<template v-if="open && data">

    <!-- CLAN intro (no clan) -->
    <template v-if="screen === 'intro'">
        <div class="band">
            <svg class="bg" viewBox="0 0 1920 505" preserveAspectRatio="none">
                <rect width="1920" height="505" fill="#000"/>
                <polygon points="0,0 1034,0 731,505 0,505" fill="#c6fe39"/>
                <polygon points="1039,0 1920,0 1920,505 736,505" fill="#262722"/>
                <polygon points="1040,0 1063,0 955,155" fill="#c6fe39" stroke="#000" stroke-width="3"/>
                <polygon points="964,190 970,190 911,290 905,293" fill="#c6fe39"/>
                <polygon points="1779,0 1803,0 1652,212" fill="#000"/>
                <polygon points="1922,0 1920,505 1479,505" fill="#000"/>
                <polygon points="1642,305 1650,305 1606,372 1600,372" fill="#000"/>
                <polygon points="1516,392 1522,392 1462,458 1452,458" fill="#000"/>
                <polygon points="1540,395 1561,395 1476,505 1430,505" fill="#000"/>
            </svg>
            <img class="art" src="img/int.png">
            <div class="itl"><span class="ghost">CLAN</span>CLAN</div>
            <div class="ibox b1"><span class="g">Join forces</span>&nbsp;with other players in a clan or&nbsp;<span class="g">create your own</span>.</div>
            <div class="ibox b2"><span class="g">Seize and control businesses</span>&nbsp;to ensure your clan's prosperity.</div>
            <div class="ibox b3"><span>Start&nbsp;<span class="g">conflicts</span>&nbsp;between clans to take control of new properties and districts, receive bonuses, and earn reputation.</span></div>
            <div class="ibox b4"><span class="g">Capture territories</span>&nbsp;to increase your influence in the state.</div>
            <div class="ibox b5"><div class="req">CREATE YOUR OWN CLAN:</div><div><span class="mark" :class="{ no: !data.hasAccount }">{{ data.hasAccount ? '✔' : '✖' }}</span>Open a bank account</div></div>
        </div>
        <div class="ibar">
            <div class="ibtn join" @click="goSearch">JOIN</div>
            <div class="ibtn create" :class="{ off: !data.hasAccount }" @click="data.hasAccount && (screen = 'create')">CREATE</div>
        </div>
        <div class="esc low" @click="close"><span class="key">ESC</span>BACK</div>
    </template>

    <!-- full pages share the dark background -->
    <div class="page" v-else>
        <div class="mark-bg">CLAN</div>
        <img v-if="screen === 'clan' && tab !== 'members'" class="crew" src="img/int.png">
        <img v-if="screen === 'search' || (screen === 'clan' && tab === 'members')" class="crew dim" src="img/int.png">
        <div class="cash" v-if="screen !== 'search'">{{ money(data.bank) }}<svg class="card" viewBox="0 0 24 24"><path :d="cardPath"/></svg></div>

        <!-- CLAN CREATION -->
        <template v-if="screen === 'create'">
            <div class="ptitle">CLAN CREATION</div>
            <div class="lbl" style="left:18.4rem;top:24.1rem">Choose an emblem:</div>
            <div v-for="n in emblemPage" :key="n" class="etile" :class="{ sel: form.emblem === n }" :style="tileStyle(n)" @click="form.emblem = n">
                <img :src="'img/emblem' + n + '.png'">
            </div>
            <div class="pager prev" @click="page = 1">&#10094;</div>
            <div class="pager num">{{ page }}/{{ pages }}</div>
            <div class="pager next" @click="page = Math.min(pages, page + 1)">&#10095;</div>
            <div class="pennant big"><img :src="'img/emblem' + form.emblem + '.png'"></div>

            <div class="lbl" style="left:106.8rem;top:24.1rem">Clan Name *</div>
            <div class="field" style="top:25.9rem;width:60rem"><input v-model="form.name" :maxlength="data.nameLength"><span class="cnt">{{ data.nameLength - form.name.length }}</span></div>
            <div class="lbl" style="left:106.8rem;top:37.2rem">Clan Tag *</div>
            <div class="field" style="top:38.9rem;width:60rem"><input v-model="form.tag" :maxlength="data.tagLength"><span class="cnt">{{ data.tagLength - form.tag.length }}</span></div>
            <div class="lbl" style="left:106.8rem;top:50.2rem">Clan Language</div>
            <div class="field sel" style="top:51.8rem;width:27.8rem"><select v-model="form.language"><option v-for="l in data.languages" :key="l">{{ l }}</option></select></div>
            <div class="lbl" style="left:138.7rem;top:50.2rem">Entry Type</div>
            <div class="field sel" style="top:51.8rem;left:138.7rem;width:28rem"><select v-model="form.entry"><option value="open">Open</option><option value="request">Upon Request</option></select></div>
            <div class="lbl" style="left:106.8rem;top:63.2rem">Description</div>
            <div class="area" style="top:64.9rem"><textarea v-model="form.description" :maxlength="data.descLength"></textarea><span class="cnt">{{ data.descLength - form.description.length }}</span></div>

            <div class="createbtn" :class="{ on: canCreate }" @click="create">CREATE {{ fmt(data.fee) }}<svg class="card" viewBox="0 0 24 24"><path :d="cardPath"/></svg></div>
            <div class="error" v-if="error">{{ error }}</div>
        </template>

        <!-- CLAN SEARCH -->
        <template v-if="screen === 'search'">
            <div class="ptitle">CLAN SEARCH</div>
            <div class="field" style="left:3.8rem;top:13.8rem;width:49rem;height:4.8rem"><input v-model="query" placeholder="Clan name..." @keydown.enter="search"></div>
            <div class="sbtn" @click="search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg></div>
            <div class="toggle" @click="openOnly = !openOnly; search()"><i :class="{ on: openOnly }"></i>Open Only</div>
            <div class="field sel" style="left:95.4rem;top:13.8rem;width:27.4rem;height:4.8rem"><select v-model="langFilter" @change="search"><option>Any Language</option><option v-for="l in data.languages" :key="l">{{ l }}</option></select></div>
            <div class="th" style="left:3.8rem">CLAN</div><div class="th" style="left:51rem">REPUTATION</div><div class="th" style="left:72rem">MEMBERS</div><div class="th" style="left:87.2rem">LANGUAGE</div><div class="th" style="left:105.1rem">STATUS</div>
            <div class="slist">
                <div v-for="c in results" :key="c.id" class="srow" :class="{ sel: picked && picked.id === c.id }" @click="picked = c">
                    <img :src="'img/emblem' + c.emblem + '.png'"><span class="nm">[{{ c.tag }}] {{ c.name }}</span>
                    <span class="c2">{{ c.reputation }}</span><span class="c3">{{ c.members }}/{{ c.max }}</span><span class="c4">{{ c.language }}</span>
                    <span class="c5"><i :class="c.entry"></i>{{ c.entry === 'open' ? 'Open' : 'Upon Request' }}</span>
                </div>
            </div>
            <div class="pennant side"><img v-if="picked" :src="'img/emblem' + picked.emblem + '.png'"><div class="rp">REPUTATION POINTS</div><div class="rpv">{{ picked ? picked.reputation : '-' }}</div></div>
            <div class="dia" style="left:144.5rem"><div class="dv"><span>{{ picked ? picked.businesses : '-' }}</span></div><div class="dl">Controlled<br>Businesses</div></div>
            <div class="dia" style="left:159.6rem"><div class="dv"><span>{{ picked ? picked.members : '-' }}</span></div><div class="dl">Total<br>Members</div></div>
            <div class="dia" style="left:174.7rem"><div class="dv"><span>{{ picked ? picked.districts : '-' }}</span></div><div class="dl">Controlled<br>Districts</div></div>
            <div class="sdesc">{{ picked ? picked.description : '' }}</div>
            <div class="error" v-if="error" style="left:131rem;top:94rem">{{ error }}</div>
        </template>

        <!-- CLAN pages -->
        <template v-if="screen === 'clan'">
            <div class="ptitle">[{{ data.clan.tag }}] {{ data.clan.name }}</div>
            <div class="tabs">
                <div class="tab t1" :class="{ on: tab === 'clan' }" @click="tab = 'clan'">CLAN</div>
                <div class="tab t2" :class="{ on: tab === 'conflicts' }" @click="tab = 'conflicts'">CONFLICTS</div>
                <div class="tab t3" :class="{ on: tab === 'business' }" @click="tab = 'business'">CONTROL OVER BUSINESSES</div>
                <div class="tab t4" :class="{ on: tab === 'members' }" @click="tab = 'members'">MEMBERS<i v-if="data.requests.length" class="dot"></i></div>
            </div>

            <!-- CLAN tab -->
            <template v-if="tab === 'clan'">
                <div class="pennant main"><img :src="'img/emblem' + data.clan.emblem + '.png'"></div>
                <div class="stat" style="left:22.7rem"><b>{{ data.clan.members }}</b>Total<br>Members</div>
                <div class="stat dia2" style="left:41.5rem"><div class="dv"><span>{{ data.clan.reputation }}</span></div>Reputation<br>Points</div>
                <div class="balance"><svg viewBox="0 0 24 24"><path d="M3 8l9-4 9 4-9 4-9-4zm0 4l9 4 9-4M3 16l9 4 9-4"/></svg>CLAN BALANCE<span class="val">{{ fmt(data.clan.balance) }}<svg class="card" viewBox="0 0 24 24"><path :d="cardPath"/></svg></span></div>
                <div class="transfer" :class="{ off: !data.me.leader }" @click="act('transfer')">TRANSFER TO ACCOUNT</div>
                <div class="ann-tab"><span>{{ data.clan.announceBy || ' ' }}</span></div>
                <div class="ann">
                    <div class="ann-t">ANNOUNCEMENT</div>
                    <svg v-if="data.me.manage" class="edit" viewBox="0 0 24 24" @click="openEdit"><path d="M4 4h9v2H6v12h12v-7h2v9H4V4zm14.6-1.4l2.8 2.8-9 9H9.6v-2.8l9-9z"/></svg>
                    <div class="ann-x">{{ data.clan.announcement || 'Your clan announcements will be here' }}</div>
                </div>
                <div class="bonus">
                    <div class="b-a">ACTIVE</div><div class="b-t">CLAN BONUSES</div>
                    <div class="bd" style="left:7rem"><div class="dv"><span>{{ data.bonuses.laundering }}%</span></div>Laundering speed</div>
                    <div class="bd" style="left:25.6rem"><div class="dv"><span>{{ data.bonuses.districts }}</span></div>Controlled Districts</div>
                    <div class="bd" style="left:44.1rem"><div class="dv"><span>{{ data.bonuses.businesses }}</span></div>Controlled Businesses</div>
                </div>
            </template>

            <!-- CONFLICTS tab -->
            <template v-if="tab === 'conflicts'">
                <div class="sect lime" style="left:3.6rem">CONFLICTS</div>
                <div class="cbox" style="left:3.6rem">
                    <div v-if="!data.conflicts.length" class="empty">No conflicts scheduled yet</div>
                    <div v-for="c in data.conflicts" :key="c.label" class="crow"><b>{{ c.label }}</b> vs {{ c.enemy }}<span>{{ c.startsIn > 0 ? 'starts in ' + clock(c.startsIn) : clock(c.left) + '  ' + c.us + ' : ' + c.them }}</span></div>
                </div>
                <div class="sect" style="left:67.4rem">CLAIMS</div>
                <div class="cbox" style="left:67.4rem">
                    <div v-if="!data.claims.length" class="empty">No active claims</div>
                    <div v-for="c in data.claims" :key="c.label" class="crow"><b>{{ c.label }}</b><span>{{ clock(c.left) }}</span></div>
                </div>
            </template>

            <!-- WHAT'S NEW (clan + conflicts) -->
            <div class="news" v-if="tab === 'clan' || tab === 'conflicts'">
                <div class="news-t">WHAT'S NEW?</div>
                <div class="news-l">
                    <div v-for="(e, i) in data.events" :key="i" class="ev">
                        <div class="ev-time">{{ hhmm(e.at) }}</div>
                        <div class="ev-b"><div class="ev-t"><span :class="e.kind">{{ e.title.split(' ')[0] }}</span> {{ e.title.split(' ').slice(1).join(' ') }}</div><div class="ev-x">{{ e.text }}</div></div>
                    </div>
                </div>
            </div>

            <!-- CONTROL OVER BUSINESSES tab -->
            <template v-if="tab === 'business'">
                <div class="scard" style="left:3.6rem"><div class="dv"><span>+{{ data.bonuses.laundering }}%</span></div>Laundering speed</div>
                <div class="scard" style="left:27.6rem"><div class="dv"><span>{{ data.bonuses.districts }}</span></div>Controlled Districts</div>
                <div class="scard" style="left:51.6rem"><div class="dv"><span>{{ data.bonuses.businesses }}</span></div>Controlled Properties</div>
                <div class="tax">
                    <div class="tax-h"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm8 3v1.2c-1.6.3-2.6 1.4-2.6 2.7 0 1.6 1.3 2.3 2.9 2.7 1.3.3 1.7.6 1.7 1.1s-.5.9-1.4.9c-.9 0-1.5-.4-1.6-1.1H8.2c.1 1.4 1.1 2.4 2.8 2.7V18h1.8v-1.2c1.6-.3 2.6-1.3 2.6-2.7 0-1.8-1.5-2.4-3.1-2.8-1.1-.3-1.5-.5-1.5-1s.5-.8 1.2-.8c.8 0 1.2.3 1.3 1h1.8c-.1-1.4-1-2.3-2.4-2.6V6H11z"/></svg>TAX COLLECTION IN:<span>{{ clock(taxIn) }}</span></div>
                    <div class="tax-x">Business control taxes are collected in the settlement where <span class="g">the clan leader resides</span>.</div>
                </div>
                <div class="ctl">CONTROLLED BY CLAN:</div>
                <div v-for="(d, i) in data.owned" :key="d.id" class="drow" :style="{ top: (46.5 + i * 17) + 'rem' }">
                    <div class="dk">District</div>
                    <div class="dn"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 017 7c0 5-7 13-7 13S5 14 5 9a7 7 0 017-7zm0 4a3 3 0 100 6 3 3 0 000-6z"/></svg>{{ d.label }}</div>
                    <div class="dval" style="left:45.4rem"><b>+{{ d.laundering }}%</b>Laundering speed</div>
                    <div class="dval" style="left:73rem"><b>{{ d.tax }}%</b>Tax collection</div>
                </div>
                <div v-if="!data.owned.length" class="empty" style="position:absolute;left:3.6rem;top:48rem">Claim a district at its board to control it.</div>
            </template>

            <!-- MEMBERS tab -->
            <template v-if="tab === 'members'">
                <div class="mic m1" :class="{ on: mview === 'list' }" @click="mview = 'list'"><svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 110 6 3 3 0 010-6zm7 1a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM3 19c0-3.3 2.7-6 6-6s6 2.7 6 6H3zm13-6c2.5 0 5 1.5 5 4.5V19h-4.5c0-2.3-.8-4.3-2.2-5.6.5-.3 1.1-.4 1.7-.4z"/></svg></div>
                <div class="mic m2" :class="{ on: mview === 'requests' }" @click="mview = 'requests'"><svg viewBox="0 0 24 24"><path d="M10 4a3 3 0 110 6 3 3 0 010-6zM4 19c0-3.3 2.7-6 6-6 1 0 2 .3 2.8.7A6 6 0 0012 17v2H4zm13-5h2v2h2v2h-2v2h-2v-2h-2v-2h2v-2z"/></svg></div>
                <template v-if="mview === 'list'">
                    <div class="mth" style="left:11.1rem">MEMBERS <span class="pink">{{ data.clan.members }}/{{ data.clan.max }}</span></div>
                    <div class="mth" style="left:59rem">RANK</div><div class="mth" style="left:91.8rem">REPUTATION POINTS</div><div class="mth" style="left:147.8rem">STATUS</div>
                    <div class="mlist">
                        <div v-for="m in data.memberList" :key="m.cid" class="mrow" :class="{ off: !m.status.online, you: m.you }">
                            <span class="mi">{{ m.rank === 'Leader' ? '★' : '◉' }}</span>
                            <span class="mn">{{ m.name }}{{ m.you ? ' (You)' : '' }}</span>
                            <span class="mr">{{ m.rank }}</span><span class="mp">{{ m.rep }}</span>
                            <span class="ms"><i :class="{ on: m.status.online }"></i>{{ m.status.text }}</span>
                            <span class="ma" @click="m.you ? act('leave') : (menuFor = menuFor === m.cid ? null : m.cid)">
                                <svg v-if="m.you" viewBox="0 0 24 24"><path d="M5 3h9v4h-2V5H7v14h5v-2h2v4H5V3zm11 5l5 4-5 4v-3h-6v-2h6V8z"/></svg>
                                <span v-else>&#10095;</span>
                            </span>
                            <div class="mmenu" v-if="menuFor === m.cid && data.me.manage">
                                <div v-for="r in data.ranks" :key="r" v-show="r !== m.rank" @click="act('setRank', m.cid, r)">{{ r.toUpperCase() }}</div>
                                <div class="kick" @click="act('kick', m.cid)">KICK</div>
                            </div>
                        </div>
                    </div>
                    <div class="invite" v-if="data.me.manage" @click="inviteOpen = !inviteOpen">INVITE PLAYER</div>
                    <div class="invbox" v-if="inviteOpen"><input v-model="inviteId" placeholder="UID" @keydown.enter="invite"><div @click="invite">INVITE</div></div>
                </template>
                <template v-else>
                    <div class="mth" style="left:11.1rem">REQUESTS</div>
                    <div class="mlist">
                        <div v-if="!data.requests.length" class="empty" style="padding:2rem">No requests</div>
                        <div v-for="r in data.requests" :key="r.cid" class="mrow">
                            <span class="mn">{{ r.name }}</span>
                            <span class="rq ok" v-if="data.me.manage" @click="act('answerRequest', r.cid, true)">ACCEPT</span>
                            <span class="rq no" v-if="data.me.manage" @click="act('answerRequest', r.cid, false)">DECLINE</span>
                        </div>
                    </div>
                </template>
            </template>

            <!-- F EDIT INFORMATION -->
            <div class="editbox" v-if="editOpen">
                <div class="lbl" style="position:static">Announcement</div>
                <div class="area" style="position:static;width:100%;height:9rem;margin:0.6rem 0 1.6rem"><textarea v-model="edit.announcement" maxlength="250"></textarea></div>
                <div class="lbl" style="position:static">Description</div>
                <div class="area" style="position:static;width:100%;height:9rem;margin:0.6rem 0 1.6rem"><textarea v-model="edit.description" :maxlength="data.descLength"></textarea></div>
                <div class="lbl" style="position:static">Entry Type</div>
                <div class="field sel" style="position:static;width:28rem;margin:0.6rem 0 2rem"><select v-model="edit.entry"><option value="open">Open</option><option value="request">Upon Request</option></select></div>
                <div class="transfer" style="position:static;width:100%" @click="saveEdit">SAVE</div>
            </div>
            <div class="error" v-if="error" style="left:75rem;top:94rem">{{ error }}</div>
        </template>

        <div class="bar">
            <div class="esc" @click="back"><span class="key">ESC</span>BACK</div>
            <div class="esc" v-if="screen === 'clan' && data.me.manage" @click="openEdit"><span class="key">F</span>EDIT INFORMATION</div>
            <div class="esc" v-if="screen === 'search' && picked" @click="join"><span class="key">E</span>{{ picked.entry === 'open' ? 'JOIN' : 'REQUEST' }}</div>
        </div>
    </div>
</template>
</div>
<script src="app.js"></script>
</body>
</html>
